name: ORBIT CI PART IS BING... BUILD, TEST , SCAN THEN PUSH TO REGISTY 

# stages:
#   - build
#   - test
#   - docker

on:
  push:
    branches: 
      - main 
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: code check
        uses: actions/checkout@v6

      - name: SET UP NODE.JS 20.19.0
        uses: actions/setup-node@v4
        with:
            node-version: '22'
            cache: npm

      - name: INSTALL DEPENDENCIES
        run: npm ci

      - name: npm build project
        run: npm run build 
        
