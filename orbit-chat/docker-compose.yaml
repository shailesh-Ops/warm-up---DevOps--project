services:
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile

    container_name: orbit-frontend-container
        

    ports:
      - "127.0.0.1:8000:80"

    expose:
      - "4000"
      - "8000"
      - "8080-8085/tcp" # specify port range 

    networks:
      - orbit-network

    env_file:
    - path: ./apps/web/.env


    # configs:
    #   nginx_config:
    #     file: ./nginx.conf 

    volumes:
      - /orbit-webapp/logs:/app/logs/



    depends_on:
      backend:
        condition: service_healthy



  backend:
    build:
      context: ./apps/api/
      dockerfile: Dockerfile
    user: root # this use for permission constrant 

    container_name: orbit-backend-container
      

    ports:
      - "127.0.0.1:4000:4000"

    env_file:
      - path: ./apps/api/.env

    healthcheck:
      test:  
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

    networks:
      - orbit-network

    expose:
      - "4000"
      - "9000"
      - "9000-9095/tcp" # specify port range 


    volumes:
      - /orbit-backend/logs:/app/logs/

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      




  redis:
    image: redis:8-alpine

    env_file:
    - ./apps/api/.env
      
    command: 
      -  sh
      -  -c 
      - 'exec redis-server --save 20 1 --loglevel warning --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"'
      - " redis-server /usr/local/etc/redis/redis.conf "    # redis configs allows to read over desire point's

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - app-data-local-redis:/data

      - ./redis.conf:/usr/local/etc/redis/redis.conf

    healthcheck:
      test:

        - CMD-SHELL
        - 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG'

      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    networks:
      - orbit-network

    restart: unless-stopped

  postgres:
    image: postgres:18-alpine

    ports:
      - "127.0.0.1:5433:5432"

    env_file:
      - ./apps/api/.env

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 12s
      timeout: 3s
      retries: 5
      start_period: 10s

    networks:
      - orbit-network

    volumes:
      - app-data-local-postgres:/var/lib/postgresql/18/docker

        # create databse automatically when start fresh new one container
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

      

  pgadmin4:        # UI base Work on postgres DB
    image: dpage/pgadmin4

    entrypoint: /entrypoint.sh

    ports:
      - "0.0.0.0:5050:80"

    env_file:
      - ./apps/api/.env

    networks:
      - orbit-network

    volumes:
      - pgadmin-data:/var/lib/pgadmin/
      # - ./servers.json:/pgadmin4/servers.json:ro

    restart: always

    depends_on:
      postgres:
        condition: service_healthy

networks:
  orbit-network:
    driver: bridge

configs:
  redis_config:
    external: true


volumes:
  app-data-local-postgres:
  app-data-local-redis:
  pgadmin-data:
  orbit-webapp:
  orbit-backend:

  
