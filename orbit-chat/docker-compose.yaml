services:
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile

    container_name: orbit-frontend-container

    # profiles: 
    #   - app # as per needed use it
    

    ports:
      - "8000:80"

    expose:
      - "4000"
      - "8000"
      - "8080-8085/tcp" # specify port range 

    networks:
      - orbit-network

    env_file:
    - path: ./apps/web/.env


    volumes:
      - /orbit-webapp/logs:/app/logs/
      - ./apps/web/nginx.conf:/etc/nginx/conf.d/default.conf

    restart: on-failure

    depends_on:
      backend:
        condition: service_healthy


# --------------------------------------------------backend-------------------------------------------------------------------------------

  backend:
    build:
      context: ./apps/api/
      dockerfile: Dockerfile
    # user: root # this use for permission constrant 

    container_name: orbit-backend-container

    # profiles: 
    #   - app  # docker compose --profile app up -d  or up 

    ports:
      - "4000:4000"

    env_file:
      - path: ./apps/api/.env
    
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.js"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

    networks:
      - orbit-network

    expose:
      - "4000"
      - "9000"
      - "9000-9095/tcp" # specify port range 

    restart: on-failure

    volumes:
      - ./logs/backend:/app/logs
      - ./certs/ca.crt:/certs/ca.crt:ro

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      


# ------------------------------------------------------redis---------------------------------------------------------------------------


  redis:
    image: redis:8-alpine

    env_file:
    - ./apps/api/.env

    pids_limit: 300

    command: 
      - sh
      - -c
      - |
        : "$${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
        exec redis-server \
          --port 0 \
          --tls-port 6379 \
          --tls-cert-file /certs/redis.crt \
          --tls-key-file /certs/redis.key \
          --tls-ca-cert-file /certs/ca.crt \
          --tls-auth-clients no \
          --requirepass "$$REDIS_PASSWORD" \
          --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/redis.crt:/certs/redis.crt:ro
      - ./certs/redis.key:/certs/redis.key:ro

      - ./redis.conf:/usr/local/etc/redis/redis.conf

    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --tls --cacert /certs/ca.crt -h localhost -p 6379 ping | grep -qx PONG']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    networks:
      - orbit-network

    restart: unless-stopped

# --------------------------------------------postgres-------------------------------------------------------------------------------------

  postgres:
    image: postgres:18-alpine

    ports:
      - "5433:5432"

    env_file:
      - ./apps/api/.env

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 12s
      timeout: 3s
      retries: 5
      start_period: 10s

    networks:
      - orbit-network

    volumes:
      - postgres_data:/var/lib/postgresql
        # create databse automatically when start fresh new one container
      - ./init/init.sql:/docker-entrypoint-initdb.d/init.sql

      
# --------------------------------------------------pgadmin4-------------------------------------------------------------------------------
  pgadmin4:        # UI base Work on postgres DB
    image: dpage/pgadmin4
  
    ports:
      - "8080:8080"

    env_file:
      - ./apps/api/.env

    networks:
      - orbit-network

    volumes:
      - pgadmin-data:/var/lib/pgadmin/


    restart: always

    depends_on:
      postgres:
        condition: service_healthy

# -------------------------------------------------container conf--------------------------------------------------------------------------------


networks:
  orbit-network:
    driver: bridge

configs:
  redis_config:
    external: true
    
volumes:
  postgres_data:
  redis-data:
  pgadmin-data:
  orbit-webapp:
  logs:

  
