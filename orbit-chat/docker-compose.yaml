services:
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile

    container_name: orbit-frontend-container
    

    ports:
      - "8000:80"

    expose:
      - "4000"
      - "8000"
      - "8080-8085/tcp" # specify port range 

    networks:
      - orbit-network

    env_file:
    - path: ./apps/web/.env


    volumes:
      - /orbit-webapp/logs:/app/logs/
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

    restart: on-failure

    depends_on:
      backend:
        condition: service_healthy


# --------------------------------------------------backend-------------------------------------------------------------------------------

  backend:
    build:
      context: ./apps/api/
      dockerfile: Dockerfile
    user: root # this use for permission constrant 

    container_name: orbit-backend-container
      
    ports:
      - "4000:4000"

    env_file:
      - path: ./apps/api/.env
    
    healthcheck:
      test:  
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

    networks:
      - orbit-network

    expose:
      - "4000"
      - "9000"
      - "9000-9095/tcp" # specify port range 

    restart: on-failure

    volumes:
      - /orbit-backend/logs:/app/logs/
      - ./certs:/certs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      


# ------------------------------------------------------redis---------------------------------------------------------------------------


  redis:
    image: redis:8-alpine

    env_file:
    - ./apps/api/.env

      
    command: 
      -  sh
      -  -c 
      - | 
        : "$${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
        exec redis-server \  
          --port 0 \
          --tls-port 6379 \
          --tls-cert-file  /certs/redis.crt \
          --tls-key-file /certs/redis.key \
          --tls-ca-cert-file /certs/ca.crt \
          --requirepass "$$REDIS_PASSWORD" \
          --appendonly yes
          
          # redis configs allows to read over desire point's

    ports:
      - "6379:6379"

    volumes:
      - app-data-local-redis:/data
      - ./certs:/certs
      - ./redis.conf:/usr/local/etc/redis/redis.conf

    healthcheck:
      test:

        - CMD-SHELL
        - 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --tls --cacert /run/redis-tls/ca.crt -h localhost -p 6379 ping | grep -qx PONG'

      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    networks:
      - orbit-network

    restart: unless-stopped

# --------------------------------------------postgres-------------------------------------------------------------------------------------

  postgres:
    image: postgres:18-alpine
      
    ports:
      - "5433:5432"

    env_file:
      - ./apps/api/.env

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 12s
      timeout: 3s
      retries: 5
      start_period: 10s

    networks:
      - orbit-network

    volumes:
      - ./postgres-local/data:/var/lib/postgresql/18/data

        # create databse automatically when start fresh new one container
      - ./init/init.sql:/docker-entrypoint-initdb.d/init.sql

      
# --------------------------------------------------pgadmin4-------------------------------------------------------------------------------
  pgadmin4:        # UI base Work on postgres DB
    image: dpage/pgadmin4

    entrypoint: /entrypoint.sh

    ports:
      - "8080:8080"

    env_file:
      - ./apps/api/.env

    networks:
      - orbit-network

    volumes:
      - pgadmin-data:/var/lib/pgadmin/


    restart: always

    depends_on:
      postgres:
        condition: service_healthy

# -------------------------------------------------container conf--------------------------------------------------------------------------------


networks:
  orbit-network:
    driver: bridge

configs:
  redis_config:
    external: true
    
volumes:
  postgres-local:
  app-data-local-redis:
  pgadmin-data:
  orbit-webapp:
  orbit-backend:

  
